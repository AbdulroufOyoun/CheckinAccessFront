<!-- activity-panel.component.html -->
<div class="activity-panel">

  <!-- Header -->
  <div class="activity-panel__header">
    <div class="activity-panel__title-row">
      <span class="activity-panel__live-dot"></span>
      <h3 class="activity-panel__title">Live Activity</h3>
    </div>
    <span class="activity-panel__count">8 events</span>
  </div>

  <!-- Activity List — *ngFor activities -->
  <div class="activity-list">

    <!-- new_booking -->
    <div class="activity-item">
      <div class="activity-item__timeline">
        <div class="activity-item__dot-wrap activity-item__dot-wrap--booking">
          <div class="activity-item__dot activity-item__dot--booking"></div>
        </div>
        <div class="activity-item__line"></div>
      </div>
      <div class="activity-item__content">
        <div class="activity-item__msg-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
            <line x1="12" y1="13" x2="12" y2="17"/>
            <line x1="10" y1="15" x2="14" y2="15"/>
          </svg>
          <span class="activity-item__msg">New booking for Ahmed Al-Rashidi</span>
        </div>
        <div class="activity-item__meta">
          <span class="activity-item__room activity-item__room--booking">101</span>
          <span class="activity-item__time">Just now</span>
        </div>
      </div>
    </div>

    <!-- check_in -->
    <div class="activity-item">
      <div class="activity-item__timeline">
        <div class="activity-item__dot-wrap activity-item__dot-wrap--checkin">
          <div class="activity-item__dot activity-item__dot--checkin"></div>
        </div>
        <div class="activity-item__line"></div>
      </div>
      <div class="activity-item__content">
        <div class="activity-item__msg-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span class="activity-item__msg">Check-in: Mohammed Al-Otaibi</span>
        </div>
        <div class="activity-item__meta">
          <span class="activity-item__room activity-item__room--checkin">202</span>
          <span class="activity-item__time">5 min ago</span>
        </div>
      </div>
    </div>

    <!-- cancellation -->
    <div class="activity-item">
      <div class="activity-item__timeline">
        <div class="activity-item__dot-wrap activity-item__dot-wrap--cancel">
          <div class="activity-item__dot activity-item__dot--cancel"></div>
        </div>
        <div class="activity-item__line"></div>
      </div>
      <div class="activity-item__content">
        <div class="activity-item__msg-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="15" y1="9" x2="9" y2="15"/>
            <line x1="9"  y1="9" x2="15" y2="15"/>
          </svg>
          <span class="activity-item__msg">Cancellation: Khalid Al-Dosari</span>
        </div>
        <div class="activity-item__meta">
          <span class="activity-item__room activity-item__room--cancel">106</span>
          <span class="activity-item__time">12 min ago</span>
        </div>
      </div>
    </div>

    <!-- check_out -->
    <div class="activity-item">
      <div class="activity-item__timeline">
        <div class="activity-item__dot-wrap activity-item__dot-wrap--checkout">
          <div class="activity-item__dot activity-item__dot--checkout"></div>
        </div>
        <div class="activity-item__line"></div>
      </div>
      <div class="activity-item__content">
        <div class="activity-item__msg-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span class="activity-item__msg">Check-out: Ibrahim Al-Shehri</span>
        </div>
        <div class="activity-item__meta">
          <span class="activity-item__room activity-item__room--checkout">301</span>
          <span class="activity-item__time">25 min ago</span>
        </div>
      </div>
    </div>

    <!-- update — last item (no line) -->
    <div class="activity-item activity-item--last">
      <div class="activity-item__timeline">
        <div class="activity-item__dot-wrap activity-item__dot-wrap--update">
          <div class="activity-item__dot activity-item__dot--update"></div>
        </div>
      </div>
      <div class="activity-item__content">
        <div class="activity-item__msg-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          <span class="activity-item__msg">Reservation updated: Faisal Al-Maliki</span>
        </div>
        <div class="activity-item__meta">
          <span class="activity-item__room activity-item__room--update">104</span>
          <span class="activity-item__time">1 h ago</span>
        </div>
      </div>
    </div>

  </div>
</div>
