<!-- ══════════════════════════════════════════════════
       DIALOG PANEL
  ══════════════════════════════════════════════════ -->
<div class="dialog-panel" role="dialog" aria-modal="true" [class.dialog-panel--rtl]="isRTL">

  <!-- ── Dialog Header ──────────────────────────── -->
  <div class="dialog-header">
    <div class="dialog-header__left">
      <!-- Icon -->
      <div class="dialog-header__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <div>
        <h2 class="dialog-header__title">New Reservation</h2>
        <p class="dialog-header__subtitle">Fill in the new reservation details</p>
      </div>
    </div>
    <button class="dialog-header__close" (click)="close()" aria-label="Close dialog">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <!-- ── Form Body ───────────────────────────────── -->
  <div class="dialog-body">
    <!-- SelectRoom -->
    <div class="form-field">
      <label class="form-field__label">Select Room</label>
      <div class="form-select-wrap">
        <!-- <svg class="form-select__icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                       15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg> -->
        <select class="form-select">
          <option value="">Select nationality</option>
          <option value="Saudi">Saudi</option>
          <option value="Egyptian">Egyptian</option>
          <option value="Yemeni">Yemeni</option>
          <option value="Kuwaiti">Kuwaiti</option>
          <option value="Qatari">Qatari</option>
          <option value="Emirati">Emirati</option>
          <option value="Omani">Omani</option>
          <option value="Bahraini">Bahraini</option>
          <option value="Jordanian">Jordanian</option>
          <option value="Syrian">Syrian</option>
          <option value="Lebanese">Lebanese</option>
          <option value="Libyan">Libyan</option>
          <option value="Algerian">Algerian</option>
          <option value="Sudanese">Sudanese</option>
        </select>
        <!-- <select class="form-select" [(ngModel)]="form.nationality"></select> -->
        <!-- <select class="form-select"></select> -->
        <!-- ChevronDown -->
        <svg class="form-select__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    </div>

    <!-- SelectGuest -->
    <div class="form-field">
      <label class="form-field__label">Select Guest</label>
      <div class="form-select-wrap">
        <!-- <svg class="form-select__icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
            fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="2" y1="12" x2="22" y2="12" />
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                       15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
          </svg> -->
        <select class="form-select">
          <option value="">Ahmad</option>
          <option value="Saudi">abdullah</option>
          <option value="Egyptian">Ammar</option>
          <option value="Yemeni">mohamed</option>
          <option value="Kuwaiti">Akfwefi</option>
          <option value="Qatari">fwef</option>
        </select>
        <!-- <select class="form-select" [(ngModel)]="form.nationality"></select> -->
        <!-- <select class="form-select"></select> -->
        <!-- ChevronDown -->
        <svg class="form-select__chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
          fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    </div>

    <div class="dialog-form">

      <!-- StartDate -->
      <div class="form-field">
        <label class="form-field__label">
          Start Date
          <span class="form-field__required">*</span>
        </label>
        <div class="form-input-wrap">
          <span class="form-input__prefix-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" class="form-input form-input--with-icon" placeholder="yyyy-mm-dd" autocomplete="name" />
        </div>
      </div>

      <!-- EndDate -->
      <div class="form-field">
        <label class="form-field__label">
          End Date
          <span class="form-field__required">*</span>

        </label>
        <div class="form-input-wrap">
          <span class="form-input__prefix-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </span>
          <input type="text" class="form-input form-input--with-icon" placeholder="yyyy-mm-dd" />
        </div>
      </div>
    </div>
  </div>

  <!-- ── Dialog Footer ──────────────────────────── -->
  <div class="dialog-footer">
    <!-- Cancel -->
    <button class="dialog-btn dialog-btn--secondary" (click)="close()">
      Cancel
    </button>

    <!-- Save (default state) -->
    <button class="dialog-btn dialog-btn--primary " disabled>
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-plus">
        <path d="M5 12h14"></path>
        <path d="M12 5v14"></path>
      </svg>
      Save
    </button>

    <!-- Save (loading state) — swap with *ngIf or [class] -->
    <!--
      <button class="dialog-btn dialog-btn--primary dialog-btn--loading" disabled>
        <span class="dialog-btn__spinner"></span>
        Loading...
      </button>
      -->

  </div>
</div>
