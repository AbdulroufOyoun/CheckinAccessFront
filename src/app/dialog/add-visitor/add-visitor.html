<div class="dialog-panel" role="dialog" aria-modal="true" [class.dialog-panel--rtl]="isRTL">
  <div class="dialog-header">
    <div class="dialog-header__left">
      <div>
        <h2 class="dialog-header__title">
          {{ (mode === 'edit' ? 'VIS_DIALOG_TITLE_EDIT' : 'VIS_DIALOG_TITLE_ADD') | translate }}
        </h2>
        <p class="dialog-header__subtitle">{{ 'VIS_DIALOG_SUBTITLE' | translate }}</p>
      </div>
    </div>
    <button class="dialog-header__close" type="button" (click)="close()" [attr.aria-label]="'CLOSE' | translate">×</button>
  </div>

  <div class="dialog-body">
    <div class="dialog-form">
      <div class="form-field">
        <label class="form-field__label">{{ 'USR_DETAIL_FULL_NAME' | translate }} *</label>
        <input type="text" class="form-input" [(ngModel)]="form.name" />
      </div>
      <div class="form-field">
        <label class="form-field__label">{{ 'USR_DIALOG_MOBILE' | translate }} *</label>
        <input type="tel" class="form-input" [(ngModel)]="form.mobile" (blur)="normalizeMobile()" dir="ltr" maxlength="14" />
      </div>
      <div class="form-field">
        <label class="form-field__label">{{ 'EMAIL' | translate }} *</label>
        <input type="email" class="form-input" [(ngModel)]="form.email" />
      </div>
      @if (mode === 'add') {
      <div class="form-field">
        <label class="form-field__label">{{ 'USR_DIALOG_PASSWORD' | translate }}</label>
        <input type="password" class="form-input" [(ngModel)]="form.password" dir="ltr" />
      </div>
      }
      @if (mode === 'edit') {
      <div class="form-field form-field--full">
        <label class="form-field__label">
          <input type="checkbox" [(ngModel)]="form.active" /> {{ 'VIS_ACTIVE' | translate }}
        </label>
      </div>
      }
    </div>
  </div>

  <div class="dialog-footer">
    <button class="dialog-btn dialog-btn--secondary" type="button" (click)="close()" [disabled]="saving">{{ 'CANCEL' | translate }}</button>
    <button class="dialog-btn dialog-btn--primary" type="button" (click)="save()" [disabled]="saving">
      {{ saving ? ('SAVING' | translate) : ('SAVE' | translate) }}
    </button>
  </div>
</div>
