<div class="dialog-panel" role="dialog" aria-modal="true" [class.dialog-panel--rtl]="isRTL">
  <div class="dialog-header">
    <div class="dialog-header__left">
      <div class="dialog-header__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </div>
      <div>
        <h2 class="dialog-header__title">{{ mode === 'edit' ? 'Edit User' : 'Add User' }}</h2>
        <p class="dialog-header__subtitle">
          Shared central users table — existing email/mobile will be linked to this tenant
        </p>
      </div>
    </div>
    <button class="dialog-header__close" type="button" (click)="close()" aria-label="Close dialog">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B7280"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>

  <div class="dialog-body">
    <div class="dialog-form">
      <div class="form-field">
        <label class="form-field__label">Full name <span class="form-field__required">*</span></label>
        <input type="text" class="form-input" name="name" [(ngModel)]="form.name" placeholder="Ahmed Al-Rashidi" />
      </div>

      <div class="form-field">
        <label class="form-field__label">Title</label>
        <select class="form-select" name="title" [(ngModel)]="form.title">
          <option value="">—</option>
          @for (t of titles; track t) {
          <option [value]="t">{{ t }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <label class="form-field__label">Mobile (10 digits) <span class="form-field__required">*</span></label>
        <input type="tel" class="form-input" name="mobile" [(ngModel)]="form.mobile" (blur)="normalizeMobile()"
          placeholder="0501234567" dir="ltr" maxlength="14" />
      </div>

      <div class="form-field">
        <label class="form-field__label">Email <span class="form-field__required">*</span></label>
        <input type="email" class="form-input" name="email" [(ngModel)]="form.email" placeholder="email@example.com" />
      </div>

      <div class="form-field">
        <label class="form-field__label">Nationality</label>
        <select class="form-select" name="nationality" [(ngModel)]="form.nationality">
          <option value="">Select nationality</option>
          @for (n of nationalities; track n) {
          <option [value]="n">{{ n }}</option>
          }
        </select>
      </div>

      @if (mode === 'add') {
      <div class="form-field">
        <label class="form-field__label">Password (optional, defaults to mobile)</label>
        <input type="password" class="form-input" name="password" [(ngModel)]="form.password" dir="ltr" />
      </div>
      }

      @if (mode === 'edit') {
      <div class="form-field form-field--full">
        <label class="form-field__label">
          <input type="checkbox" [(ngModel)]="form.active" name="active" /> Active
        </label>
      </div>
      }
    </div>
  </div>

  <div class="dialog-footer">
    <button class="dialog-btn dialog-btn--secondary" type="button" (click)="close()" [disabled]="saving">Cancel</button>
    <button class="dialog-btn dialog-btn--primary" type="button" (click)="save()" [disabled]="saving">
      {{ saving ? 'Saving…' : 'Save' }}
    </button>
  </div>
</div>
