<div class="as pwd-dlg" role="dialog" aria-modal="true" [class.as--rtl]="isRTL">
  <div class="as__hero">
    <div class="as__hero-bg" aria-hidden="true"></div>
    <button class="as__close" type="button" (click)="close()" [attr.aria-label]="'CLOSE' | translate">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>

    <p class="as__eyebrow">{{ 'PWD_EYEBROW' | translate }}</p>
    <h2 class="as__title">
      {{ (mode === 'self' ? 'PWD_TITLE_SELF' : 'PWD_TITLE_RESET') | translate }}
    </h2>
    @if (mode === 'reset' && adminName) {
    <div class="as__preview">
      <div class="as__preview-code">PW</div>
      <div class="as__preview-body">
        <strong>{{ adminName }}</strong>
        <span>{{ 'PWD_RESET_HINT' | translate }}</span>
      </div>
    </div>
    }
  </div>

  <div class="as__body">
    <!-- decoy fields reduce browser autofill into the real inputs -->
    <div class="pwd-dlg__decoy" aria-hidden="true">
      <input type="text" tabindex="-1" autocomplete="username" />
      <input type="password" tabindex="-1" autocomplete="current-password" />
    </div>

    <section class="as__section">
      @if (mode === 'self') {
      <label class="as__field">
        <span class="as__label">{{ 'PWD_OLD' | translate }} <i>*</i></span>
        <div class="pwd-dlg__input-wrap" dir="ltr">
          <input class="pwd-dlg__input" [type]="showOld ? 'text' : 'password'"
            name="pwd_old_manual" [(ngModel)]="form.old_password" autocomplete="off"
            autocapitalize="off" spellcheck="false" />
          <button type="button" class="pwd-dlg__toggle" (click)="showOld = !showOld; $event.preventDefault()"
            [attr.aria-label]="(showOld ? 'PWD_HIDE' : 'PWD_SHOW') | translate"
            [attr.title]="(showOld ? 'PWD_HIDE' : 'PWD_SHOW') | translate">
            @if (showOld) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </label>
      }

      <label class="as__field">
        <span class="as__label">{{ 'PWD_NEW' | translate }} <i>*</i></span>
        <div class="pwd-dlg__input-wrap" dir="ltr">
          <input class="pwd-dlg__input" [type]="showNew ? 'text' : 'password'"
            name="pwd_new_manual" [(ngModel)]="form.password"
            [placeholder]="'ADM_PASSWORD_PLACEHOLDER' | translate" autocomplete="off"
            autocapitalize="off" spellcheck="false" />
          <button type="button" class="pwd-dlg__toggle" (click)="showNew = !showNew; $event.preventDefault()"
            [attr.aria-label]="(showNew ? 'PWD_HIDE' : 'PWD_SHOW') | translate"
            [attr.title]="(showNew ? 'PWD_HIDE' : 'PWD_SHOW') | translate">
            @if (showNew) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </label>

      <label class="as__field">
        <span class="as__label">{{ 'PWD_CONFIRM' | translate }} <i>*</i></span>
        <div class="pwd-dlg__input-wrap" dir="ltr">
          <input class="pwd-dlg__input" [type]="showConfirm ? 'text' : 'password'"
            name="pwd_confirm_manual" [(ngModel)]="form.password_confirmation"
            autocomplete="off" autocapitalize="off" spellcheck="false" />
          <button type="button" class="pwd-dlg__toggle" (click)="showConfirm = !showConfirm; $event.preventDefault()"
            [attr.aria-label]="(showConfirm ? 'PWD_HIDE' : 'PWD_SHOW') | translate"
            [attr.title]="(showConfirm ? 'PWD_HIDE' : 'PWD_SHOW') | translate">
            @if (showConfirm) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
            } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            }
          </button>
        </div>
      </label>
    </section>
  </div>

  <div class="as__footer">
    <button class="as__btn as__btn--ghost" type="button" (click)="close()" [disabled]="saving">
      {{ 'CANCEL' | translate }}
    </button>
    <button class="as__btn as__btn--primary" type="button" (click)="save()"
      [disabled]="saving || !canSave">
      @if (saving) {
      <span class="as__spinner"></span> {{ 'SAVING' | translate }}
      } @else {
      {{ 'PWD_SAVE' | translate }}
      }
    </button>
  </div>
</div>
