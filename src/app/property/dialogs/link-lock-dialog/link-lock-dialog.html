<div class="dialog-shell" [class.rtl]="isRTL" [dir]="isRTL ? 'rtl' : 'ltr'">
  <header class="dialog-head">
    <div>
      <p class="eyebrow">{{ 'PROP_MODULE' | translate }}</p>
      <h2>{{ 'PROP_LINK_LOCKS' | translate }}</h2>
    </div>
    <button type="button" class="icon-btn" (click)="close()" [disabled]="saving">×</button>
  </header>

  <div class="dialog-body">
    <p class="hint-warn">
      <strong>⚠</strong>
      {{ 'LOCKS_UNLINK_FIRST_HINT' | translate }}
    </p>

    <label class="field">
      <span>{{ 'SEARCH' | translate }}</span>
      <input [(ngModel)]="search" name="search" [placeholder]="'PROP_SEARCH_LOCKS' | translate" />
    </label>

    <ul class="lock-list">
      @for (lock of filtered; track lock.id) {
        <li [class.is-busy]="isLinkedElsewhere(lock)">
          <label class="lock-row" [class.is-busy]="isLinkedElsewhere(lock)">
            <input
              type="checkbox"
              [checked]="isChecked(lock.id)"
              [disabled]="isLinkedElsewhere(lock)"
              (change)="toggle(lock.id)"
            />
            <span class="lock-meta">
              <strong>{{ lock.lockName || lock.lockAlias || ('#' + lock.id) }}</strong>
              <small>{{ lock.lockId || lock.lockMac || '' }}</small>
            </span>
            @if (isLinkedHere(lock.id)) {
              <span class="status status--here">
                ✓ {{ 'LOCKS_STATUS_LINKED_HERE' | translate }}
              </span>
            } @else if (isLinkedElsewhere(lock)) {
              <span class="status status--busy">
                {{ 'LOCKS_STATUS_LINKED_ELSEWHERE' | translate }}
              </span>
            }
          </label>
        </li>
      } @empty {
        <li class="empty">{{ 'PROP_NO_LOCKS' | translate }}</li>
      }
    </ul>
  </div>

  <footer class="dialog-foot">
    <button type="button" class="btn ghost" (click)="close()" [disabled]="saving">{{ 'CANCEL' | translate }}</button>
    <button type="button" class="btn primary" (click)="save()" [disabled]="saving">
      {{ saving ? ('SAVING' | translate) : ('SAVE' | translate) }}
    </button>
  </footer>
</div>
