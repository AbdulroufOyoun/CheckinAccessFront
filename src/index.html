<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CheckinAccess — Tenant operations</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="CheckinAccess tenant admin for bookings, education, locks, and access control.">
  <meta name="theme-color" content="#142744">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="favicon.png" sizes="64x64">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; min-height: 100%; background: #142744; }
    .skip-link {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 10000;
      padding: 8px 12px;
      background: #111827;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      transform: translateY(-150%);
    }
    .skip-link:focus { transform: none; }
    .boot-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #142744;
    }
    .boot-card {
      width: min(100% - 32px, 400px);
      padding: 48px 32px;
      background: #fff;
      border-radius: 20px;
      text-align: center;
    }
    .boot-text {
      margin: 0;
      font: 700 22px system-ui, 'Segoe UI', sans-serif;
      color: #111827;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <app-root>
    <div class="boot-screen" aria-busy="true" aria-label="Loading CheckinAccess">
      <div class="boot-card">
        <p class="boot-text">CheckinAccess</p>
      </div>
    </div>
  </app-root>
  <noscript>CheckinAccess requires JavaScript to run.</noscript>
</body>
</html>
